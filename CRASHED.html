<html><head><style>
      :root { --sidebar-width: 550px; --ast-height: 300px; }
      body { 
        font-family: 'Menlo', monospace; font-size: 11px; background: #1e1e1e; color: #d4d4d4; 
        margin: 0; display: grid; grid-template-columns: 1fr 5px var(--sidebar-width); height: 100vh; 
        overflow: hidden; 
      }

.mermaid .edgeLabel rect {
    fill: #2d2d2d !important;      /* Dark Gray/Black box */
    stroke: #9370db !important;    /* Purple border to make it pop */
    stroke-width: 1.5px !important;
    rx: 2px;                       /* Very slight rounding for sharpness */
    opacity: 0.71 !important;         /* 100% solid, no softness */
}

.mermaid .edgeLabel {
    color: #8b0000 !important;      /* Pure white text */
    font-weight: 900 !important;   /* Extra Bold */
    font-size: 13px !important;    /* Large enough to read easily */
    font-family: 'Menlo', monospace;
    text-shadow: none !important;  /* Remove all "dreamy" shadows */
}

/* 3. The Edges: Darker Green for better text overlay */
.mermaid path.edgePath {
    stroke: #2d8a39 !important;    /* Solid Forest Green */
    stroke-width: 2.5px !important;
}
      #left-pane { overflow: auto; padding: 20px; border-right: 1px solid #333; }
      #resizer { cursor: col-resize; background: #333; transition: background 0.2s; }
      #resizer:hover { background: #569cd6; }
      #right-pane { display: grid; grid-template-rows: 1fr 5px var(--ast-height); background: #252526; height: 100vh; overflow: hidden; }
      #top-right { overflow-y: auto; display: flex; flex-direction: column; }
      #h-resizer { cursor: row-resize; background: #333; transition: background 0.2s; z-index: 10; }
      #h-resizer:hover { background: #569cd6; }
      #ast-pane { overflow: auto; background: #1a1a1a; position: relative; border-top: 1px solid #111; }
      .tabs { position: sticky; top: 0; display: flex; background: #2d2d2d; border-bottom: 1px solid #3e3e3e; z-index: 5; }
      .tab { padding: 8px 15px; cursor: pointer; border-right: 1px solid #3e3e3e; color: #888; }
      .tab.active { background: #252526; color: #fff; border-bottom: 2px solid #569cd6; }
.ast-body { 
    color: #9cdcfe; 
    white-space: pre-wrap; /* This preserves 
 and wraps long lines */
    font-family: 'Menlo', 'Monaco', monospace; 
    font-size: 11px; 
    padding: 15px; 
    display: inline-block;
    min-width: 100%;       /* Ensures background covers the width */
}
            .ast-header { position: sticky; top: 0; left: 0; background: #111; color: #569cd6; font-weight: bold; padding: 8px 15px; font-size: 10px; z-index: 4; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
      .pin-btn { cursor: pointer; padding: 2px 8px; border: 1px solid #444; border-radius: 3px; background: #2d2d2d; color: #888; }
      .pin-btn.active { background: #569cd6; color: #fff; border-color: #fff; }
      .graph-box { border-left: 1px solid #444; margin-left: 15px; padding-left: 10px; }
      summary { cursor: pointer; color: #569cd6; font-weight: bold; padding: 2px; }
      .node-item { color: #ce9178; margin: 1px 0; }
      mark.highlight { background-color: #f0f000; color: #000; font-weight: bold; }
      #dag-modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
      #dag-content { background: #1e1e1e; margin: 5% auto; padding: 20px; width: 90%; height: 80%; overflow: auto; border-radius: 8px; border: 1px solid #444; }
      #dag-toolbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 101; background: #2d2d2d; border: 1px solid #555; border-radius: 6px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; color: #d4d4d4; }
      #dag-toolbar button { background: #3e3e3e; color: #b5cea8; border: 1px solid #555; border-radius: 3px; cursor: pointer; padding: 0 8px; font-size: 13px; }
      #dag-zoom { width: 220px; }
      #dag-content svg { transform-origin: top left; max-width: none !important; height: auto !important; }
      .render-btn { font-size: 9px; cursor: pointer; background: #3e3e3e; color: #b5cea8; border: 1px solid #555; border-radius: 3px; margin-left: 10px; padding: 1px 4px; }
      .render-btn:hover { background: #569cd6; color: #fff; }

      function updateRightPane() {
        if (!isPinned) document.getElementById('ast-content').textContent = currentGraph.ast || 'No AST Pragma attached.';
        const container = document.getElementById('pane-content');
        container.innerHTML = '';
        if (activeTab === 'sym') {
          (currentGraph.symtab || []).forEach(s => {
            const div = document.createElement('div'); div.textContent = s; container.appendChild(div);
          });
        } else {
          data.typemap.forEach(t => {
            const div = document.createElement('div'); div.innerHTML = `<span style='color:#4ec9b0'>[${t.id}]</span> ${t.desc}`; container.appendChild(div);
          });
        }
      }
      async function renderDAG(graph) {
        const modal = document.getElementById('dag-modal');
        const content = document.getElementById('dag-content');
  
         // 1. Show modal and WIPE the old content entirely
        modal.style.display = 'block';
        content.innerHTML = ''; 
        // 2. Create a fresh PRE element
        const pre = document.createElement('pre');
        pre.className = 'mermaid';
        pre.textContent = generateMermaidCode(graph);
        content.appendChild(pre);
      
        // 3. The Secret Sauce: Wait 10ms
        // This ensures the DOM has actually rendered the text 
        // before the Mermaid parser starts its work.
        await new Promise(r => setTimeout(r, 10));
        try {
          // 4. Run specifically on the NEW element
          await mermaid.run({
            nodes: [pre]
          });
          applyZoom();
        } catch (err) {
          console.error("Mermaid Error:", err);
          // If it fails, show the code so you can debug the syntax
          content.innerHTML += `<div style="color:red;font-size:10px;">
                                  ${err.message}<br>
                                  <pre>${pre.textContent}</pre>
                                </div>`;
        }
      }
      function applyZoom() {
        const slider = document.getElementById('dag-zoom');
        if (!slider) return;
        const z = slider.value / 100;
        document.getElementById('dag-zoom-label').textContent = Math.round(z*100) + '%';
        const svg = document.querySelector('#dag-content svg');
        if (svg) { svg.style.transformOrigin = 'top left'; svg.style.transform = 'scale(' + z + ')'; }
      }
      function zoomStep(d) {
        const s = document.getElementById('dag-zoom');
        s.value = Math.max(20, Math.min(400, parseInt(s.value) + d*100));
        applyZoom();
      }
      function resetZoom() { document.getElementById('dag-zoom').value = 100; applyZoom(); }
      function generateMermaidCode(rootGraph) {
        let lines = ["---\nconfig:\nlayout: tidy-tree\n---\ngraph TD"];
        let edgeCount = 0;
        function traverse(graph, prefix) {
          (graph.nodes || []).forEach(n => {
            const uid = prefix + n.id;
            if (n.id === 0) {
              let inLabel = "Boundary IN";
              if (n.in_ports && n.in_ports.length > 0) {
                inLabel += "\n" + n.in_ports.join("\n");
              }
              let outLabel = "Boundary OUT";
              if (n.out_ports && n.out_ports.length > 0) {
                outLabel += "\n" + n.out_ports.join("\n");
              }
              inLabel = inLabel.split('"').join('\\"');
              outLabel = outLabel.split('"').join('\\"');
              lines.push(`  N${uid}_IN{{"${inLabel}"}}`);
              lines.push(`  N${uid}_OUT{{"${outLabel}"}}`);
              lines.push(`  style N${uid}_IN fill:#1e2a1e,stroke:#b5cea8,stroke-width:2px,color:#b5cea8`);
              lines.push(`  style N${uid}_OUT fill:#2a1e1e,stroke:#ce9178,stroke-width:2px,color:#ce9178`);
            } else {
              let labelPart = (n.label || "").trim();
              if (labelPart === "" || labelPart === "[]") labelPart = n.type;
              let text = labelPart.replace(/[\[\]"{}]/g, "");
              if (n.value && n.value !== n.label && n.value !== labelPart) {
                text += " (" + n.value.replace(/[\[\]"{}]/g, "") + ")";
              }
              lines.push(`  N${uid}(("${n.id}: ${text}"))`);
              // Do NOT recurse into subgraphs here -- each subgraph has its
              // own 'Render DAG' button in the tree.  Just mark compounds
              // (dashed) so you know to drill in.  Keeps each view one level.
              if (n.subgraph) lines.push(`  style N${uid} stroke-dasharray: 6 4,stroke-width:2px`);
            }
          });
          (graph.data_edges || []).forEach(e => {
            const m = e.match(/(\d+):(\d+)\s*->\s*(\d+):(\d+)\s*(.*)/);
            if (m) {
              const s = m[1] === "0" ? `N${prefix}0_IN` : `N${prefix}${m[1]}`;
              const d = m[3] === "0" ? `N${prefix}0_OUT` : `N${prefix}${m[3]}`;
              lines.push(`  ${s} -- "p${m[2]}→p${m[4]}\n${m[5]}" --> ${d}`);
              lines.push(`  linkStyle ${edgeCount++} stroke:#4ec9b0,stroke-width:2px`);
            }
          });
        }
        traverse(rootGraph, "");
        return lines.join("\n");
      }
      function buildTree(container, graph, isRoot = false) {
        const details = document.createElement('details');
        details.open = isRoot;
        const summary = document.createElement('summary');
        summary.textContent = `Graph {${graph.nodes.length} nodes}`;
        summary.onclick = (e) => { e.stopPropagation(); currentGraph = graph; updateRightPane(); };
        details.appendChild(summary);

        const box = document.createElement('div'); 
        box.className = 'graph-box';
        
        graph.nodes.forEach(n => {
          const d = document.createElement('div');
          let labelPart = (n.label || "").trim();
          if (labelPart === "" || labelPart === "[]") {
            labelPart = n.type;
          }
          let nodeText = `Node ${n.id}: ${labelPart}`;
          if (n.id === 0) {
            let details = [];
            if (n.in_ports && n.in_ports.length > 0) {
              details.push('In: [' + n.in_ports.join('; ') + ']');
            }
            if (n.out_ports && n.out_ports.length > 0) {
              details.push('Out: [' + n.out_ports.join('; ') + ']');
            }
            if (details.length > 0) {
              nodeText += ' ' + details.join(', ');
            }
          } else if (n.value && n.value !== n.label && n.value !== 
           labelPart) {
            nodeText += ` (${n.value})`;
          }
          if (n.subgraph) {
            d.innerHTML = `<b>${nodeText}</b>`;
            buildTree(d, n.subgraph, false);
          } else {
            d.className = 'node-item';
            d.textContent = nodeText;
          }
          box.appendChild(d);
        });
        // Data Edges with DAG Button
        const de = document.createElement('details'); de.open = true;
        const deSum = document.createElement('summary');
        deSum.style.color = '#b5cea8';
        deSum.textContent = `Data Edges (${graph.data_edges.length})`;
        
        const btn = document.createElement('button');
        btn.className = 'render-btn';
        btn.textContent = 'Render DAG 🎨';
        btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); renderDAG(graph); };
        
        deSum.appendChild(btn);
        de.appendChild(deSum);
        graph.data_edges.forEach(e => { 
          const d = document.createElement('div'); d.style.color='#b5cea8'; d.textContent='  ' + e; de.appendChild(d); 
        });
        box.appendChild(de);

        // Error Edges
        const ee = document.createElement('details');
        ee.innerHTML = `<summary style='color:#c62828'>Error Edges (${graph.error_edges.length})</summary>`;
        graph.error_edges.forEach(e => { 
          const d = document.createElement('div'); d.style.color='#ff6b6b'; d.textContent='  ' + e; ee.appendChild(d); 
        });
        box.appendChild(ee);

        details.appendChild(box); 
        container.appendChild(details);
      }
      
      // Resizer Logic (Vertical)
      const vResizer = document.getElementById('resizer');
      let isVResizing = false;
      vResizer.onmousedown = () => { isVResizing = true; document.body.style.userSelect = 'none'; };

      // Resizer Logic (Horizontal)
      const hResizer = document.getElementById('h-resizer');
      let isHResizing = false;
      hResizer.onmousedown = () => { isHResizing = true; document.body.style.userSelect = 'none'; };

      document.onmousemove = (e) => {
        if (isVResizing) {
          const width = window.innerWidth - e.clientX;
          if (width > 150) document.body.style.setProperty('--sidebar-width', width + 'px');
        }
        if (isHResizing) {
          const height = window.innerHeight - e.clientY;
          if (height > 50) document.body.style.setProperty('--ast-height', height + 'px');
        }
      };
      document.onmouseup = () => { isVResizing = isHResizing = false; document.body.style.userSelect = 'auto'; };

      buildTree(document.getElementById('root'), data, true);
    </script></body></html>
